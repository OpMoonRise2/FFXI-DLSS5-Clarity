name: Problem report
description: Crash, installer refusal, missing effect or anything else not working
title: "[Problem] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Logs are what make a problem fixable, so please start with step 1.

        **1.** Run `CollectLogs.cmd` from your `bootloader\FFXI-DLSS5-Clarity-<version>\` folder (right after the problem, before launching again). It saves `FFXI-Clarity-support-<date>.zip` on your desktop and changes nothing. Your Windows user name and PC name are removed from it.
        **2.** Drag that zip into the "Support zip" box below.

        No `CollectLogs.cmd` (1.2.2 or older)? Attach these instead: `bootloader\dlss5-feed.log`, `bootloader\ReShade.log`, `bootloader\host64\OptiScaler.log`, `bootloader\host64\dlss5-feed-host.log`, `bootloader\host64\ReShade.log`, and paste what `Check.cmd` prints.
  - type: dropdown
    id: kind
    attributes:
      label: What happens?
      options:
        - Game crashes or closes on launch / login
        - Game crashes later (zoning, combat, menus)
        - Check.cmd or Install.cmd refuses (NEEDED lines)
        - Game runs but no DLSS / neural effect
        - Effects on the UI, wrong depth or visual glitches
        - Low fps or stutter
        - Something else
    validations:
      required: true
  - type: textarea
    id: zip
    attributes:
      label: Support zip
      description: Drag FFXI-Clarity-support-<date>.zip here (or the log files listed above).
      placeholder: Drop the zip here
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Clarity version
      placeholder: "1.2.4"
    validations:
      required: true
  - type: dropdown
    id: loader
    attributes:
      label: Loader / server
      options:
        - Ashita v4 (private server)
        - Phoenix launcher
        - HorizonXI launcher
        - Windower
        - Other (say below)
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: GPU and driver
      placeholder: "RTX 4070, driver 616.56"
    validations:
      required: true
  - type: dropdown
    id: before
    attributes:
      label: What did this bootloader have before Clarity?
      description: Leftover files from another graphics mod are the most common cause of problems.
      multiple: true
      options:
        - Nothing, plain install
        - Deep Fried Chicken
        - DLSS 5 Manager / DLSS5-Feeder on its own
        - RenoDX
        - Another dgVoodoo or ReShade setup
        - An earlier Clarity version
        - Not sure
  - type: dropdown
    id: hosttest
    attributes:
      label: Result of `bootloader\host64\dlss5-feed-host64.exe --test`
      options:
        - 300/300 evaluates succeeded
        - Failed or fewer than 300 (paste the output below)
        - Did not run it
  - type: textarea
    id: details
    attributes:
      label: What you did and what happened
      description: Steps, when it fails, any error text. Has Restore.cmd brought the game back?
    validations:
      required: true
